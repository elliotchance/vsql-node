name: Release

# The package (with the prebuilds from test.yml, which builds them for each OS
# and architecture) is published to npm when a GitHub release is published. The
# version is the release's tag (v1.2.3 is 1.2.3). It's published with trusted
# publishing, so there's no npm token.

on:
  release:
    types: [published]

jobs:
  # Builds and tests the prebuilds.
  test:
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish to npm
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/vsql-node
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: npm publish
