name: Test

# libvsql is compiled once for each OS and architecture (by prebuildify), and
# the prebuild is tested with each version of Node, rather than compiling it
# again for each one. The addon uses Node-API, so the same prebuild works for
# every version. release.yml calls this to build the prebuilds that it
# publishes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  prebuild:
    name: Prebuild for ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is built on Debian 11, so the prebuilds work with glibc 2.31 or
          # later.
          - { os: Linux, arch: x86-64, runner: ubuntu-latest, container: "node:22-bullseye" }
          - { os: Linux, arch: ARM64, runner: ubuntu-24.04-arm, container: "node:22-bullseye" }
          # musl (such as Alpine) is built in Alpine with docker run, rather
          # than as the job's container, since JavaScript actions (such as
          # checkout) can't run in an Alpine container on ARM64.
          - { os: Linux musl, arch: x86-64, runner: ubuntu-latest, alpine: true }
          - { os: Linux musl, arch: ARM64, runner: ubuntu-24.04-arm, alpine: true }
          - { os: macOS, arch: x86-64, runner: macos-15-intel }
          - { os: macOS, arch: ARM64, runner: macos-latest }
          - { os: Windows, arch: x86-64, runner: windows-latest }
          - { os: Windows, arch: ARM64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ !matrix.container && !matrix.alpine }}
        with:
          node-version: 22
      # prebuildify compiles the addon, so npm install doesn't need to.
      - if: ${{ !matrix.alpine }}
        run: npm ci --ignore-scripts
      - if: ${{ !matrix.alpine }}
        run: npm run prebuildify
      - if: ${{ matrix.alpine }}
        run: >-
          docker run --rm -v "$PWD:/w" -w /w node:22-alpine sh -ec
          "apk add --no-cache python3 make g++ &&
          npm ci --ignore-scripts && npm run prebuildify"
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds

  test:
    name: ${{ matrix.os }} (${{ matrix.arch }}), Node ${{ matrix.node }}
    needs: [prebuild]
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, Linux musl, macOS, Windows]
        arch: [x86-64, ARM64]
        node: ["22", "24", "26"]
        include:
          - { os: Linux, arch: x86-64, runner: ubuntu-latest }
          - { os: Linux, arch: ARM64, runner: ubuntu-24.04-arm }
          # musl is tested in Alpine with docker run (see prebuild).
          - { os: Linux musl, arch: x86-64, runner: ubuntu-latest, alpine: true }
          - { os: Linux musl, arch: ARM64, runner: ubuntu-24.04-arm, alpine: true }
          - { os: macOS, arch: x86-64, runner: macos-15-intel }
          - { os: macOS, arch: ARM64, runner: macos-latest }
          - { os: Windows, arch: x86-64, runner: windows-latest }
          - { os: Windows, arch: ARM64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ !matrix.alpine }}
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds
      # Doesn't compile the addon. node-gyp-build loads the prebuild instead,
      # since there's no build/Release.
      - if: ${{ !matrix.alpine }}
        run: npm ci --ignore-scripts
      - if: ${{ !matrix.alpine }}
        run: npm test
      - if: ${{ !matrix.alpine }}
        run: node example/main.js
      - if: ${{ matrix.alpine }}
        run: >-
          docker run --rm -v "$PWD:/w" -w /w node:${{ matrix.node }}-alpine sh -ec
          "npm ci --ignore-scripts && npm test && node example/main.js"

  # The tests must cover all of lib and src/binding.c (see scripts/coverage.sh).
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run coverage
